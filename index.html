<!DOCTYPE html>
<!--
  WLOC 选点页（自建版）
  协议来源：xepes0/wloc 的 wloc-settings.js 与 gcj-browser.js（AGPL-3.0）
  本实现：https://github.com/Gucvii/wloc
  说明：页面无后端；坐标写入 https://gs-loc.apple.com/wloc-settings/save，
        该请求由手机端代理脚本在本地截住，不离开设备。
        页面不含任何预设坐标。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WLOC">
<title>WLOC 选点</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%93%8D%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#f5f5f7; --card:#fff; --fg:#1d1d1f; --muted:#6e6e73; --line:#e3e3e6;
  --accent:#0071e3; --ok:#1a9c4b; --warn:#c2410c; --danger:#d92c20; --tap:#eef4fd;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC",system-ui,sans-serif}
body{padding:12px 12px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:19px;margin:4px 0 10px;display:flex;align-items:center;gap:8px}
.pill{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;
  background:#ececef;color:var(--muted);white-space:nowrap}
.pill.ok{background:#e3f6e9;color:var(--ok)}
.pill.bad{background:#fdeceb;color:var(--danger)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;margin-bottom:10px}
.row:last-child{margin-bottom:0}
.field{flex:1;min-width:0}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:500}
input[type=number],input[type=text]{width:100%;padding:10px 11px;font-size:16px;
  border:1px solid var(--line);border-radius:10px;background:#fbfbfd;color:var(--fg);
  font-variant-numeric:tabular-nums}
input:focus{outline:none;border-color:var(--accent);background:#fff}
.btn{display:block;width:100%;padding:12px;font-size:15px;font-weight:600;
  border:none;border-radius:11px;background:var(--tap);color:var(--accent);cursor:pointer}
.btn:active{opacity:.65}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{background:#fdeceb;color:var(--danger)}
.btn.secondary{background:#ececef;color:var(--fg)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--fg)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns .full{grid-column:1/-1}
.note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
.note.warn{color:var(--warn)}
.note.bad{color:var(--danger)}
#map{height:46vh;min-height:260px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.layers{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px}
.layers button{flex:none;padding:7px 13px;font-size:13px;font-weight:600;border-radius:999px;
  border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer}
.layers button.active{background:var(--fg);border-color:var(--fg);color:#fff}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;
  border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.kv:last-child{border-bottom:none}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-weight:600}
footer{font-size:11px;color:var(--muted);line-height:1.7;text-align:center;padding:6px 4px}
footer a{color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(20px);background:rgba(29,29,31,.94);color:#fff;
  font-size:13.5px;padding:10px 16px;border-radius:11px;max-width:88vw;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:9999}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<h1>WLOC 选点 <span class="pill" id="status">检查中…</span></h1>

<div class="card">
  <button class="btn ghost" id="ipBtn" style="margin-bottom:10px">根据出口 IP 匹配坐标</button>
  <div class="note" id="ipInfo" style="margin-top:0;margin-bottom:12px">向 ipwho.is / ipinfo.io 查询当前出口 IP 的归属地。匹配结果只是起点，建议再核对。</div>

  <div class="row">
    <div class="field">
      <label>纬度 latitude</label>
      <input id="lat" type="number" step="any" min="-90" max="90" inputmode="decimal">
    </div>
    <div class="field">
      <label>经度 longitude</label>
      <input id="lon" type="number" step="any" min="-180" max="180" inputmode="decimal">
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label>精度 accuracy（米）</label>
      <input id="acc" type="number" step="1" min="0" value="50" inputmode="numeric">
    </div>
    <div class="field">
      <label>扰动半径（米）</label>
      <input id="radius" type="number" step="1" min="0" value="0" inputmode="numeric">
    </div>
  </div>
  <div class="btns">
    <button class="btn primary full" id="saveBtn">储存到设备</button>
    <button class="btn secondary" id="queryBtn">查询当前</button>
    <button class="btn secondary" id="dragBtn">定位到该点</button>
    <button class="btn" id="deviceBtn">读取设备定位</button>
    <button class="btn danger" id="clearBtn">恢复真实定位</button>
  </div>
  <div class="note" id="coherence"></div>
  <div class="note" id="readout"></div>
</div>

<div class="card">
  <div class="layers" id="layers">
    <button data-layer="satellite" class="active">卫星</button>
    <button data-layer="standard">标准</button>
    <button data-layer="amap">高德</button>
    <button data-layer="dark">暗色</button>
  </div>
  <div id="map"></div>
  <div class="note" id="mapNote">点地图或拖图钉选点，坐标会自动填入上面的输入框。</div>
</div>

<div class="card">
  <div class="kv"><span>已保存坐标</span><span id="savedCoord">—</span></div>
  <div class="kv"><span>已保存精度</span><span id="savedAcc">—</span></div>
  <div class="kv"><span>已保存扰动</span><span id="savedRadius">—</span></div>
  <div class="kv"><span>保存时间</span><span id="savedAt">—</span></div>
  <div class="note">这里显示设备上真实生效的值。「查询当前」只读取本地存储，不访问 Apple。</div>
</div>

<footer>
  无后端 · 页面不含预设坐标 · 写入由手机端代理脚本本地拦截<br>
  协议参考 <a href="https://github.com/xepes0/wloc" target="_blank" rel="noopener">xepes0/wloc</a>（AGPL-3.0）·
  本页 <a href="https://github.com/Gucvii/wloc" target="_blank" rel="noopener">Gucvii/wloc</a>
</footer>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ---------- GCJ-02 换算（来自 xepes0/wloc 的 gcj-browser.js, AGPL-3.0） ---------- */
var GCJ_A = 6378245.0, GCJ_EE = 0.00669342162296594323;
function gcjOutOfChina(lng, la) {
  return lng < 72.004 || lng > 137.8347 || la < 0.8293 || la > 55.8271;
}
function gcjDeltaLat(x, y) {
  var r = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
  r += ((20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0) / 3.0;
  r += ((20.0 * Math.sin(y * Math.PI) + 40.0 * Math.sin((y / 3.0) * Math.PI)) * 2.0) / 3.0;
  r += ((160.0 * Math.sin((y / 12.0) * Math.PI) + 320 * Math.sin((y * Math.PI) / 30.0)) * 2.0) / 3.0;
  return r;
}
function gcjDeltaLon(x, y) {
  var r = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
  r += ((20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0) / 3.0;
  r += ((20.0 * Math.sin(x * Math.PI) + 40.0 * Math.sin((x / 3.0) * Math.PI)) * 2.0) / 3.0;
  r += ((150.0 * Math.sin((x / 12.0) * Math.PI) + 300.0 * Math.sin((x / 30.0) * Math.PI)) * 2.0) / 3.0;
  return r;
}
function wgs84ToGcj02(lat, lon) {
  if (gcjOutOfChina(lon, lat)) return { lat: lat, lon: lon };
  var dLat = gcjDeltaLat(lon - 105.0, lat - 35.0);
  var dLon = gcjDeltaLon(lon - 105.0, lat - 35.0);
  var radLat = (lat / 180.0) * Math.PI;
  var magic = Math.sin(radLat);
  magic = 1 - GCJ_EE * magic * magic;
  var sqrtMagic = Math.sqrt(magic);
  dLat = (dLat * 180.0) / (((GCJ_A * (1 - GCJ_EE)) / (magic * sqrtMagic)) * Math.PI);
  dLon = (dLon * 180.0) / ((GCJ_A / sqrtMagic) * Math.cos(radLat) * Math.PI);
  return { lat: lat + dLat, lon: lon + dLon };
}
function gcj02ToWgs84(lat, lon) {
  if (gcjOutOfChina(lon, lat)) return { lat: lat, lon: lon };
  var wgsLat = lat, wgsLon = lon;
  for (var i = 0; i < 6; i++) {
    var g = wgs84ToGcj02(wgsLat, wgsLon);
    var errLat = g.lat - lat, errLon = g.lon - lon;
    if (Math.abs(errLat) < 1e-9 && Math.abs(errLon) < 1e-9) break;
    wgsLat -= errLat; wgsLon -= errLon;
  }
  return { lat: wgsLat, lon: wgsLon };
}

/* ---------- 设备接口 ---------- */
var API = 'https://gs-loc.apple.com/wloc-settings/save';

function api(params) {
  var qs = new URLSearchParams(params).toString();
  return fetch(API + '?' + qs, { cache: 'no-store' }).then(function (r) { return r.json(); });
}

var $ = function (id) { return document.getElementById(id); };
var toastTimer = null;
function toast(msg, ms) {
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('show'); }, ms || 2200);
}
function setStatus(text, cls) {
  var p = $('status');
  p.textContent = text;
  p.className = 'pill' + (cls ? ' ' + cls : '');
}

/* ---------- 输入 ---------- */
function num(id) {
  var v = parseFloat($(id).value);
  return Number.isFinite(v) ? v : null;
}
function readInputs() {
  var lat = num('lat'), lon = num('lon');
  if (lat === null || lon === null) return null;
  if (Math.abs(lat) > 90 || Math.abs(lon) > 180) return null;
  var a = num('acc'), r = num('radius');
  return {
    lat: lat,
    lon: lon,
    acc: Math.max(0, Math.round(a === null ? 50 : a)),
    radius: Math.max(0, Math.round(r === null ? 0 : r))
  };
}
function haversine(a, b, c, d) {
  var R = 6378137, toRad = Math.PI / 180;
  var dLat = (c - a) * toRad, dLon = (d - b) * toRad;
  var s = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(a * toRad) * Math.cos(c * toRad) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(s)));
}
function fmt(v, p) { return v === null || v === undefined ? '—' : Number(v).toFixed(p === undefined ? 6 : p); }

function coherence() {
  var v = readInputs();
  var el = $('coherence');
  if (!v) { el.textContent = ''; el.className = 'note'; return; }
  if (v.radius === 0) {
    el.className = 'note';
    el.textContent = '扰动半径 0：每次返回同一坐标，与真实网络定位的确定性一致。';
  } else if (v.radius > v.acc / 2) {
    el.className = 'note warn';
    el.textContent = '扰动半径 ' + v.radius + ' 米大于精度的一半（' + Math.round(v.acc / 2) +
      ' 米）。每次响应会随机偏移，可能与申报精度自相矛盾，建议改为 0。';
  } else {
    el.className = 'note';
    el.textContent = '扰动半径 ' + v.radius + ' 米，小于精度的一半，可视为正常抖动。';
  }
}
['lat', 'lon', 'acc', 'radius'].forEach(function (id) {
  $(id).addEventListener('input', coherence);
});

/* ---------- 地图 ---------- */
var map = L.map('map', { zoomControl: true, attributionControl: false }).setView([20, 0], 2);
var layers = {
  standard: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }),
  satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }),
  amap: L.tileLayer('https://wprd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&style=7&x={x}&y={y}&z={z}', { subdomains: '1234', maxZoom: 19 }),
  dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 })
};
var currentLayer = 'satellite';
layers.satellite.addTo(map);

var marker = null;
function isGcj() { return currentLayer === 'amap'; }
function toMap(lat, lon) { return isGcj() ? wgs84ToGcj02(lat, lon) : { lat: lat, lon: lon }; }
function toWgs(lat, lon) { return isGcj() ? gcj02ToWgs84(lat, lon) : { lat: lat, lon: lon }; }

function placeMarker(lat, lon, zoom) {
  if (!marker) {
    marker = L.marker([lat, lon], { draggable: true }).addTo(map);
    marker.on('dragend', function () { setFromMap(marker.getLatLng()); });
  } else {
    marker.setLatLng([lat, lon]);
  }
  if (zoom) map.setView([lat, lon], zoom);
}
function syncFromInputs() {
  var v = readInputs();
  if (!v) return;
  var m = toMap(v.lat, v.lon);
  placeMarker(m.lat, m.lon);
}
function setFromMap(latlng) {
  var w = toWgs(latlng.lat, latlng.lng);
  $('lat').value = w.lat.toFixed(6);
  $('lon').value = w.lon.toFixed(6);
  coherence();
  cacheInputs();
}

map.on('click', function (e) {
  placeMarker(e.latlng.lat, e.latlng.lng);
  setFromMap(e.latlng);
});
['lat', 'lon'].forEach(function (id) {
  $(id).addEventListener('change', syncFromInputs);
});

$('layers').addEventListener('click', function (e) {
  var btn = e.target.closest('button');
  if (!btn) return;
  var name = btn.dataset.layer;
  if (!layers[name]) return;
  var v = readInputs();
  map.removeLayer(layers[currentLayer]);
  currentLayer = name;
  layers[name].addTo(map);
  Array.prototype.forEach.call($('layers').children, function (b) {
    b.classList.toggle('active', b === btn);
  });
  $('mapNote').textContent = name === 'amap'
    ? '高德图源为 GCJ-02 偏移坐标，选点已自动换算回 WGS84 写入设备。'
    : '点地图或拖图钉选点，坐标会自动填入上面的输入框。';
  if (v) {
    var m = toMap(v.lat, v.lon);
    placeMarker(m.lat, m.lon);
    map.setView([m.lat, m.lon], map.getZoom());
  }
});

/* ---------- IP 匹配 ---------- */
function validCoord(lat, lon) {
  return Number.isFinite(lat) && Number.isFinite(lon) &&
    Math.abs(lat) <= 90 && Math.abs(lon) <= 180 && !(lat === 0 && lon === 0);
}

function ipMatch() {
  $('ipInfo').textContent = '查询中…';
  var done = false;

  function ok(info) {
    if (done) return;
    done = true;
    $('lat').value = info.lat.toFixed(6);
    $('lon').value = info.lon.toFixed(6);
    coherence();
    var m = toMap(info.lat, info.lon);
    placeMarker(m.lat, m.lon, 12);
    var parts = [info.city, info.region, info.country, info.tz].filter(Boolean);
    $('ipInfo').textContent = parts.join(' · ') + '　via ' + info.src +
      '（' + info.lat.toFixed(4) + ', ' + info.lon.toFixed(4) + '）';
    toast('已按出口 IP 填充：' + (info.city || info.country || '未知'), 2600);
    cacheInputs();
  }

  function fail() {
    if (done) return;
    done = true;
    $('ipInfo').textContent = 'IP 归属地服务不可用（可能被代理拦截或限流），请手动填写。';
    toast('IP 匹配失败，请手动填写坐标', 3000);
  }

  var timer = setTimeout(fail, 9000);

  fetch('https://ipwho.is/', { cache: 'no-store' }).then(function (r) { return r.json(); })
    .then(function (j) {
      if (j && j.success && validCoord(j.latitude, j.longitude)) {
        clearTimeout(timer);
        ok({
          lat: j.latitude, lon: j.longitude,
          city: j.city, region: j.region, country: j.country,
          tz: (j.timezone || {}).id, src: 'ipwho.is'
        });
        return;
      }
      throw new Error('ipwho');
    })
    .catch(function () {
      return fetch('https://ipinfo.io/json', { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (j && typeof j.loc === 'string') {
            var p = j.loc.split(',');
            var la = parseFloat(p[0]), lo = parseFloat(p[1]);
            if (validCoord(la, lo)) {
              clearTimeout(timer);
              ok({ lat: la, lon: lo, city: j.city, region: j.region, country: j.country, tz: j.timezone, src: 'ipinfo.io' });
              return;
            }
          }
          throw new Error('ipinfo');
        });
    })
    .catch(function () { clearTimeout(timer); fail(); });
}

$('ipBtn').addEventListener('click', ipMatch);

/* ---------- 设备操作 ---------- */
function renderSaved(j) {
  if (j && j.success) {
    $('savedCoord').textContent = fmt(j.latitude) + ', ' + fmt(j.longitude);
    $('savedAcc').textContent = (j.accuracy == null ? 25 : j.accuracy) + ' 米';
    $('savedRadius').textContent = (j.randomRadius == null ? 0 : j.randomRadius) + ' 米';
    $('savedAt').textContent = j.updatedAt ? String(j.updatedAt).replace('T', ' ').slice(0, 19) : '—';
  } else if (j) {
    $('savedCoord').textContent = '未设置（透传真实定位）';
    $('savedAcc').textContent = '—';
    $('savedRadius').textContent = '—';
    $('savedAt').textContent = '—';
  } else {
    $('savedCoord').textContent = '—';
    $('savedAcc').textContent = '—';
    $('savedRadius').textContent = '—';
    $('savedAt').textContent = '—';
  }
}

function query(silent) {
  return api({ action: 'query' }).then(function (j) {
    if (j && typeof j === 'object' && 'success' in j) {
      setStatus('模块已生效', 'ok');
      renderSaved(j);
      if (!silent && j.success) {
        $('lat').value = j.latitude;
        $('lon').value = j.longitude;
        $('acc').value = j.accuracy == null ? 25 : j.accuracy;
        $('radius').value = j.randomRadius == null ? 0 : j.randomRadius;
        syncFromInputs();
        coherence();
      }
      return j;
    }
    throw new Error('bad response');
  }).catch(function () {
    setStatus('模块未生效', 'bad');
    renderSaved(undefined);
    if (!silent) toast('未连上模块：检查代理开关、HTTPS 解密、证书信任', 3600);
  });
}

$('saveBtn').addEventListener('click', function () {
  var v = readInputs();
  if (!v) { toast('请先填写有效的经纬度'); return; }
  api({ action: 'save', lat: v.lat, lon: v.lon, acc: v.acc, randomRadius: v.radius })
    .then(function (j) {
      if (j && j.success) {
        toast('已写入设备，请关/开定位服务或重启手机刷新缓存', 3200);
        renderSaved(j);
        setStatus('模块已生效', 'ok');
        cacheInputs();
      } else {
        toast('写入失败：' + ((j && j.error) || '未知原因'), 3200);
      }
    })
    .catch(function () {
      setStatus('模块未生效', 'bad');
      toast('未连上模块，检查代理与证书', 3200);
    });
});

$('queryBtn').addEventListener('click', function () { query(false); });

$('dragBtn').addEventListener('click', function () {
  var v = readInputs();
  if (!v) { toast('请先填写有效的经纬度'); return; }
  var m = toMap(v.lat, v.lon);
  placeMarker(m.lat, m.lon, Math.max(map.getZoom(), 14));
  toast('已定位到 ' + fmt(v.lat, 4) + ', ' + fmt(v.lon, 4));
});

$('clearBtn').addEventListener('click', function () {
  api({ action: 'clear' }).then(function (j) {
    if (j && j.success) {
      toast('已清除，请关/开定位服务恢复真实位置', 3200);
      renderSaved(null);
    } else {
      toast('清除失败：' + ((j && j.error) || '未知原因'), 3000);
    }
  }).catch(function () {
    setStatus('模块未生效', 'bad');
    toast('未连上模块，检查代理与证书', 3200);
  });
});

$('deviceBtn').addEventListener('click', function () {
  if (!navigator.geolocation) { toast('此浏览器不支持定位'); return; }
  toast('读取中…', 1200);
  navigator.geolocation.getCurrentPosition(function (pos) {
    var d = pos.coords.latitude, e = pos.coords.longitude;
    var v = readInputs();
    var out = '设备认为你在：' + fmt(d) + ', ' + fmt(e) +
      '\n浏览器报告精度：' + Math.round(pos.coords.accuracy) + ' 米';
    if (v) {
      var dist = haversine(v.lat, v.lon, d, e);
      out += '\n与填写坐标相距：' + (dist >= 1000 ? (dist / 1000).toFixed(2) + ' 公里' : Math.round(dist) + ' 米');
      out += dist < 100 ? '\n✅ 基本一致，改写已生效' : '\n⚠️ 偏差较大，检查是否已刷新定位缓存';
    }
    $('readout').textContent = out;
    $('readout').className = 'note';
  }, function (err) {
    var msg = '定位被拒绝或不可用';
    if (err && err.code === 1) msg = '定位权限被拒绝：设置 → 隐私与安全性 → 定位服务 → Safari 网站 → 使用 App 期间';
    $('readout').textContent = msg;
    $('readout').className = 'note bad';
  }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
});

/* ---------- 本地缓存 ---------- */
function cacheInputs() {
  var v = readInputs();
  if (!v) return;
  try { localStorage.setItem('wloc.last', JSON.stringify(v)); } catch (e) {}
}

/* ---------- 启动 ---------- */
(function init() {
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem('wloc.last') || 'null'); } catch (e) {}
  if (saved && validCoord(saved.lat, saved.lon)) {
    $('lat').value = saved.lat;
    $('lon').value = saved.lon;
    if (saved.acc != null) $('acc').value = saved.acc;
    if (saved.radius != null) $('radius').value = saved.radius;
    var m = toMap(saved.lat, saved.lon);
    placeMarker(m.lat, m.lon, 11);
  }
  coherence();
  query(true);
})();

['lat', 'lon', 'acc', 'radius'].forEach(function (id) {
  $(id).addEventListener('change', cacheInputs);
});
</script>
